name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  supported-python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.1
          uv sync --extra dev
      - name: Run synthetic test suite without sockets
        run: uv run --no-sync python -m pytest -q

  quality-and-package:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.1
          uv sync --extra dev
      - name: Verify lock and public tracked files
        run: |
          uv lock --check
          uv run --no-sync python scripts/check_public_artifacts.py --tracked
      - name: Check lint, format, and types
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy src
      - name: Build wheel and source distribution
        run: uv run --no-sync python -m build --no-isolation
      - name: Inspect distributions
        run: uv run --no-sync python scripts/check_public_artifacts.py --artifacts dist
      - name: Install wheel outside the checkout
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/ntulearn-wheel"
          "${RUNNER_TEMP}/ntulearn-wheel/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/ntulearn-wheel/bin/ntulearn" --help >/dev/null
          "${RUNNER_TEMP}/ntulearn-wheel/bin/python" - <<'PY'
          from pathlib import Path
          import ntulearn_skill

          module_path = Path(ntulearn_skill.__file__).resolve()
          assert "site-packages" in module_path.parts, module_path
          assert ntulearn_skill.__version__ == "0.0.0"
          print(f"clean wheel import: PASS ({module_path})")
          PY

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install locked environment
        run: |
          python -m pip install uv==0.12.1
          uv sync --extra dev
      - name: Query Python Packaging Advisory Database
        run: uv run --no-sync pip-audit --local --skip-editable --progress-spinner off
      - name: Record dependency license metadata
        run: uv run --no-sync pip-licenses --from=mixed --format=plain-vertical
